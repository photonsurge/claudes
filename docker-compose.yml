# Image names resolve under the project's titan GitLab registry by default:
#   titan.photonsurge.uk:5050/thronix/weather-channel/<service>:<tag>
# Override REGISTRY / TAG via the environment (CI sets REGISTRY=$CI_REGISTRY_IMAGE).
#   build:  docker compose build
#   push:   docker compose push          (after: docker login titan.photonsurge.uk:5050)
#   deploy: docker compose pull && docker compose up -d
services:
  mongodb:
    image: mongo:8
    restart: unless-stopped
    # --quiet drops the per-connection "accepted/ended" NETWORK log spam the pools
    # + healthcheck otherwise flood the log with. Errors/warnings still log.
    command: ["mongod", "--quiet"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    volumes:
      - mongo-data:/data/db
    # Cheap TCP liveness: mongod only opens 27017 once it's ready to serve, so a
    # raw connect is a valid readiness gate WITHOUT spinning up mongosh (a full
    # Node shell that logged a "Connection not authenticating" line per probe).
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/27017"]
      interval: 30s          # quiet steady-state
      start_interval: 3s     # but probe fast during start_period so gating is snappy
      timeout: 5s
      retries: 5
      start_period: 30s
    stop_grace_period: 30s
    networks: [internal]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    environment:
      # Referenced ($$-escaped) by the healthcheck below, not by the server.
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 30s
      start_interval: 3s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [internal]

  socket:
    image: ${REGISTRY:-titan.photonsurge.uk:5050/thronix/weather-channel}/socket:${TAG:-latest}
    build:
      context: .
      dockerfile: socket/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: 10101
    # Published on loopback so a host nginx reverse-proxies it (Socket.IO).
    # Set BIND_HOST=0.0.0.0 if nginx runs off-box / in another container.
    ports:
      - "${BIND_HOST:-127.0.0.1}:10101:10101"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://127.0.0.1:'+(process.env.PORT||10101)+'/healthz',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"
      interval: 30s
      start_interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [internal]

  worker:
    image: ${REGISTRY:-titan.photonsurge.uk:5050/thronix/weather-channel}/worker:${TAG:-latest}
    build:
      context: .
      dockerfile: worker/Dockerfile
    restart: unless-stopped
    # Weather pipeline vars (MODEL, FORECAST_HOURS, STEP_HOURS, RUN_CHECK_CRON,
    # RETAIN_RUNS) flow in via env_file — no structural change needed here.
    # The Dockerfile provides wgrib2 at runtime.
    env_file: .env
    environment:
      PORT: 10102
      ELEVATION_CACHE_DIR: /app/dem-cache
      # Natural Earth geojson (countries.seed mask) — read from the shared host
      # data dir mounted below, NOT baked into the image.
      WEATHER_DATA_DIR: /app/data
      # Externalised blob store: baked textures / frame archives / aurora-etc
      # caches are written here instead of into Mongo. Same host dir the public
      # container reads (+ writes ad/admin-image uploads to). See shared/db/blob-fs.ts.
      BLOB_DIR: /app/blobs
    # Worker HTTP (health/status) — proxied/health-checked via nginx.
    ports:
      - "${BIND_HOST:-127.0.0.1}:10102:10102"
    volumes:
      - dem-cache:/app/dem-cache
      # Shared basemap/geojson assets (./fetch-assets.sh output). Kept out of the
      # registry image; the deploy syncs them to the host's ${DATA_DIR:-./data}.
      - ${DATA_DIR:-./data}:/app/data:ro
      # Shared blob store (read-write) — the worker bakes textures/frames/etc here.
      # Host-bind so it's out of the Mongo dump and trivially rsync-able for backup.
      # NOTE: both containers run as uid/gid 1001, but a bind-mount inherits the
      # HOST dir's ownership (Docker auto-creates it root:root). Chown it ONCE on
      # the host or the app gets EACCES on mkdir:
      #   mkdir -p ./blobs && sudo chown -R 1001:1001 ./blobs
      - ${BLOB_DIR:-./blobs}:/app/blobs
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      socket:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://127.0.0.1:'+(process.env.PORT||10102)+'/healthz',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"
      interval: 30s
      start_interval: 5s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks: [internal]

  public:
    image: ${REGISTRY:-titan.photonsurge.uk:5050/thronix/weather-channel}/public:${TAG:-latest}
    build:
      context: .
      dockerfile: public/Dockerfile
      args:
        NEXT_PUBLIC_SOCKET_URL: ${NEXT_PUBLIC_SOCKET_URL}
    restart: unless-stopped
    # Geocoding var (GEOCODER_URL) flows in via env_file — no change needed.
    env_file: .env
    environment:
      PORT: 10100
      # Server-side status checks (/api/status) hit these over the compose
      # `internal` network by service name — not the host-published ports.
      SOCKET_INTERNAL_URL: http://socket:10101
      WORKER_INTERNAL_URL: http://worker:10102
      # Shared blob store: the tex/media/aurora/etc API routes read bytes from
      # here (Mongo I/O off the hot path), and the admin upload routes WRITE ad +
      # admin-image bytes here — so this mount is read-write, not ro.
      BLOB_DIR: /app/blobs
    # Next.js app — nginx proxies the public domain here.
    ports:
      - "${BIND_HOST:-127.0.0.1}:10100:10100"
    volumes:
      # Basemap textures + geojson served at /data. Same shared host dir as the
      # worker; kept out of the registry image (Next serves public/ from disk at
      # request time, so a bind-mount over the data subdir is served live).
      - ${DATA_DIR:-./data}:/app/public/public/data:ro
      # Shared blob store (read-write) — same host dir as the worker. Reads serve
      # textures/media; writes persist ad + admin-image uploads. Same one-time host
      # chown applies (uid/gid 1001): `sudo chown -R 1001:1001 ./blobs`.
      - ${BLOB_DIR:-./blobs}:/app/blobs
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      socket:
        condition: service_healthy
      worker:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://127.0.0.1:'+(process.env.PORT||10100)+'/api/status',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"
      interval: 30s
      start_interval: 5s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks: [internal]

networks:
  internal:
    driver: bridge

volumes:
  mongo-data:
  redis-data:
  dem-cache:
