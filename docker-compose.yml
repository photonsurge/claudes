# Image names resolve under the project's titan GitLab registry by default:
#   titan.photonsurge.uk:5050/thronix/weather-channel/<service>:<tag>
# Override REGISTRY / TAG via the environment (CI sets REGISTRY=$CI_REGISTRY_IMAGE).
#   build:  docker compose build
#   push:   docker compose push          (after: docker login titan.photonsurge.uk:5050)
#   deploy: docker compose pull && docker compose up -d
#
# TOTAL RAM: Compose has no native "whole-project" ceiling, so we bound each
# service with `mem_limit` and the SUM of the caps is the effective total.
# Defaults below sum to ~14GB, sized for the 16GB test VM (leaves ~2GB for the
# host OS, page cache, and the worker's top-of-hour bake to spike into). Every
# cap is env-overridable per host.
#   mongo 2.5 + redis 0.5 + socket 0.5 + worker 6 + public 4.5 = 14GB
# NOTE: a mem_limit is a HARD wall — Docker OOM-kills the container the instant
# it's exceeded. So each cap must sit ABOVE that service's real footprint. In
# particular the worker/public NODE_OPTIONS heap ceilings must leave headroom
# UNDER their mem_limit (heap == mem_limit ⇒ Docker kills before V8 ever GCs).
#
# LOGGING: every service points at &default-logging — Docker's json-file driver
# with SIZE-based rotation (Docker has no daily/time-based rotation). Each service
# gets its own capped set of files under /var/lib/docker/containers/<id>/, so one
# chatty service can't fill the disk. Defaults: 50MB × 5 = ~250MB/service ceiling,
# oldest dropped as new ones fill. Line timestamps are captured in the json envelope
# — view them with `docker compose logs -t <svc>` (or `docker logs -t <container>`).
# Tune per host via LOG_MAX_SIZE / LOG_MAX_FILE.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "${LOG_MAX_SIZE:-50m}"
    max-file: "${LOG_MAX_FILE:-5}"

services:
  mongodb:
    image: mongo:8
    restart: unless-stopped
    # ~1.5GB WiredTiger cache + ~0.5-1GB connections/sorts/index-builds. Keep
    # this comfortably above MONGO_CACHE_GB or Docker kills mongod mid-query.
    mem_limit: ${MONGO_MEMORY_LIMIT:-2500m}
    # --quiet drops the per-connection "accepted/ended" NETWORK log spam the pools
    # + healthcheck otherwise flood the log with. Errors/warnings still log.
    #
    # --wiredTigerCacheSizeGB caps Mongo's storage cache. UNCAPPED, WiredTiger
    # targets ~50% of (host RAM − 1GB) — ≈3.9GB on an 8GB VPS — and grows into it
    # by design, which on a box shared with the worker + public is an OOM-kill
    # waiting to happen (and it muddies any memory observation of the apps).
    # 1.5GB is plenty here: the bulky payloads live on the ${BLOB_DIR} disk
    # store, not in Mongo — the cache only needs the metadata working set. Total
    # mongod RSS runs ~0.5-1GB above the cache (connections, sorts, index
    # builds), so 1.5 ≈ a ~2-2.5GB container. Tune per host via MONGO_CACHE_GB.
    command: ["mongod", "--quiet", "--wiredTigerCacheSizeGB", "${MONGO_CACHE_GB:-1.5}"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    volumes:
      - mongo-data:/data/db
    # Cheap TCP liveness: mongod only opens 27017 once it's ready to serve, so a
    # raw connect is a valid readiness gate WITHOUT spinning up mongosh (a full
    # Node shell that logged a "Connection not authenticating" line per probe).
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/27017"]
      interval: 30s          # quiet steady-state
      start_interval: 3s     # but probe fast during start_period so gating is snappy
      timeout: 5s
      retries: 5
      start_period: 30s
    stop_grace_period: 30s
    logging: *default-logging
    networks: [internal]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Small keyspace (BullMQ queues + short-TTL focus cache); 512m is generous.
    mem_limit: ${REDIS_MEMORY_LIMIT:-512m}
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    environment:
      # Referenced ($$-escaped) by the healthcheck below, not by the server.
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 30s
      start_interval: 3s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging: *default-logging
    networks: [internal]

  socket:
    image: ${REGISTRY:-titan.photonsurge.uk:5050/thronix/weather-channel}/socket:${TAG:-latest}
    build:
      context: .
      dockerfile: socket/Dockerfile
    # Was `no` ("require a human restart so failures are visible"), but the host
    # is power-cycled daily by the hypervisor — that policy turned every reboot
    # into an outage lasting until someone SSH'd in. Failures stay visible via
    # infra/watch-containers.sh, which logs every die/restart to
    # ~/weather-incidents.log; that's the right place for it, not a dead stack.
    restart: unless-stopped
    # Thin Socket.IO relay — no heavy buffers; 512m covers it.
    mem_limit: ${SOCKET_MEMORY_LIMIT:-512m}
    env_file: .env
    environment:
      PORT: 10101
    # Published on loopback so a host nginx reverse-proxies it (Socket.IO).
    # Set BIND_HOST=0.0.0.0 if nginx runs off-box / in another container.
    ports:
      - "${BIND_HOST:-127.0.0.1}:10101:10101"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://127.0.0.1:'+(process.env.PORT||10101)+'/healthz',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"
      interval: 30s
      start_interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *default-logging
    networks: [internal]

  worker:
    image: ${REGISTRY:-titan.photonsurge.uk:5050/thronix/weather-channel}/worker:${TAG:-latest}
    build:
      context: .
      dockerfile: worker/Dockerfile
    restart: unless-stopped   # see socket
    # MUST stay above the worker's own force-exit backstop (worker/src/index.ts,
    # shutdown()). They were both 10s, so Docker SIGKILLed the container 7ms
    # before the app's own timer fired — every stop truncated the drain
    # mid-flush ("MongoServerError: interrupted at shutdown"). Docker's deadline
    # now sits 15s clear of the app's, so a graceful drain always wins the race.
    stop_grace_period: 45s
    # Heaviest service: 4GB V8 heap (NODE_OPTIONS below) + bake threads/sharp
    # native on top ≈ ~5GB worst case. 6g gives the top-of-hour bake ~2GB of
    # native headroom above the heap. Cap MUST stay above the heap ceiling —
    # if you lower this, lower WORKER_NODE_HEAP_MB with it (leave ~1GB headroom).
    mem_limit: ${WORKER_MEMORY_LIMIT:-6g}
    # Weather pipeline vars (MODEL, FORECAST_HOURS, STEP_HOURS, RUN_CHECK_CRON,
    # RETAIN_RUNS) flow in via env_file — no structural change needed here.
    # The Dockerfile provides wgrib2 at runtime.
    env_file: .env
    environment:
      PORT: 10102
      # V8 heap ceiling. Without this the worker gets V8's DEFAULT (2GB on an
      # 8-16GB host) — which is what the staging top-of-hour OOMs crashed into
      # while the box had 5GB+ free. 4096 heap + bake threads/sharp native on
      # top ≈ a ~5GB worst-case container. Override per host in .env.
      NODE_OPTIONS: "--max-old-space-size=${WORKER_NODE_HEAP_MB:-4096}"
      # glibc defaults to 8 malloc arenas PER CORE; under bursty Buffer/sharp
      # traffic the arenas ratchet to the burst's high-water and never return it
      # — the "hundreds of MB, then boom, then flat forever" RSS plateau. Two
      # arenas keeps contention fine for a Node process and gives most of that
      # plateau back to the OS.
      MALLOC_ARENA_MAX: "2"
      # Alert-blob dissolve child kill switch. The rebuild is ~2min of solid CPU
      # on an idle dev box, but on a loaded 4-core VPS (GFS ingest + bake thread
      # + Mongo all contending) it can legitimately run far longer — staging hit
      # the old 15min default and got SIGKILLed mid-rebuild. 35min keeps the
      # wedged-child protection while giving a starved-but-progressing rebuild
      # room to finish; the job repeats every 15min regardless, so a slow cycle
      # just means the next tick's shapes land late, not never.
      ALERT_DISSOLVE_TIMEOUT_MS: ${ALERT_DISSOLVE_TIMEOUT_MS:-2100000}
      ELEVATION_CACHE_DIR: /app/dem-cache
      # Natural Earth geojson (countries.seed mask) — read from the shared host
      # data dir mounted below, NOT baked into the image.
      WEATHER_DATA_DIR: /app/data
      # Externalised blob store: baked textures / frame archives / aurora-etc
      # caches are written here instead of into Mongo. Same host dir the public
      # container reads (+ writes ad/admin-image uploads to). See shared/db/blob-fs.ts.
      BLOB_DIR: /app/blobs
    # Worker HTTP (health/status) — proxied/health-checked via nginx.
    ports:
      - "${BIND_HOST:-127.0.0.1}:10102:10102"
    volumes:
      - dem-cache:/app/dem-cache
      # Shared basemap/geojson assets (./fetch-assets.sh output). Kept out of the
      # registry image; the deploy syncs them to the host's ${DATA_DIR:-./data}.
      - ${DATA_DIR:-./data}:/app/data:ro
      # Shared blob store (read-write) — the worker bakes textures/frames/etc here.
      # Host-bind so it's out of the Mongo dump and trivially rsync-able for backup.
      # NOTE: both containers run as uid/gid 1001, but a bind-mount inherits the
      # HOST dir's ownership (Docker auto-creates it root:root). Chown it ONCE on
      # the host or the app gets EACCES on mkdir:
      #   mkdir -p ./blobs && sudo chown -R 1001:1001 ./blobs
      - ${BLOB_DIR:-./blobs}:/app/blobs
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      socket:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://127.0.0.1:'+(process.env.PORT||10102)+'/healthz',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"
      interval: 30s
      start_interval: 5s
      timeout: 5s
      retries: 5
      start_period: 60s
    logging: *default-logging
    networks: [internal]

  public:
    image: ${REGISTRY:-titan.photonsurge.uk:5050/thronix/weather-channel}/public:${TAG:-latest}
    build:
      context: .
      dockerfile: public/Dockerfile
      args:
        NEXT_PUBLIC_SOCKET_URL: ${NEXT_PUBLIC_SOCKET_URL}
    restart: unless-stopped   # see socket
    # Hard container memory ceiling. Override per host in .env; exceeding it
    # causes Docker to OOM-kill/restart this service instead of exhausting the host.
    mem_limit: ${PUBLIC_MEMORY_LIMIT:-4608m}
    # Geocoding var (GEOCODER_URL) flows in via env_file — no change needed.
    env_file: .env
    environment:
      PORT: 10100
      # V8 heap cap. Deliberately BELOW mem_limit: the gap is non-heap RSS
      # (sharp/glibc arenas, buffers), so heap == mem_limit would let Docker
      # OOM-kill the container before V8 ever felt pressure and ran a full GC.
      NODE_OPTIONS: "--max-old-space-size=${PUBLIC_NODE_HEAP_MB:-3072}"
      # See worker: caps glibc arena ratchet — the first big texture/media burst
      # otherwise sets a permanent ~1GB RSS floor out of free-but-unreturned arenas.
      MALLOC_ARENA_MAX: "2"
      # Server-side status checks (/api/status) hit these over the compose
      # `internal` network by service name — not the host-published ports.
      SOCKET_INTERNAL_URL: http://socket:10101
      WORKER_INTERNAL_URL: http://worker:10102
      # Optional key for /api/queue-logs (pull retained per-job worker logs via
      # curl/tooling, e.g. `?key=…`). Unset ⇒ that endpoint is admin-session-only;
      # the /admin/queue card doesn't need it (it uses the operator's login).
      QUEUE_LOG_KEY: ${QUEUE_LOG_KEY:-}
      # Shared blob store: the tex/media/aurora/etc API routes read bytes from
      # here (Mongo I/O off the hot path), and the admin upload routes WRITE ad +
      # admin-image bytes here — so this mount is read-write, not ro.
      BLOB_DIR: /app/blobs
    # Next.js app — nginx proxies the public domain here.
    ports:
      - "${BIND_HOST:-127.0.0.1}:10100:10100"
    volumes:
      # Basemap textures + geojson served at /data. Same shared host dir as the
      # worker; kept out of the registry image (Next serves public/ from disk at
      # request time, so a bind-mount over the data subdir is served live).
      - ${DATA_DIR:-./data}:/app/public/public/data:ro
      # Shared blob store (read-write) — same host dir as the worker. Reads serve
      # textures/media; writes persist ad + admin-image uploads. Same one-time host
      # chown applies (uid/gid 1001): `sudo chown -R 1001:1001 ./blobs`.
      - ${BLOB_DIR:-./blobs}:/app/blobs
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      socket:
        condition: service_healthy
      worker:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://127.0.0.1:'+(process.env.PORT||10100)+'/api/status',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"
      interval: 30s
      start_interval: 5s
      timeout: 5s
      retries: 5
      start_period: 60s
    logging: *default-logging
    networks: [internal]

networks:
  internal:
    driver: bridge

volumes:
  mongo-data:
  redis-data:
  dem-cache:
