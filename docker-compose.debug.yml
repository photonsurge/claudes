# Heap-leak capture override for `public` — PRELOAD HOOK (writes where we can see it).
#
# The --heapsnapshot-signal / --heapsnapshot-near-heap-limit flags kept failing:
# they write to the process CWD (lost inside the container), fail silently, and
# the near-limit one serialises a ~2GB heap and tips the VM. Instead we preload
# scripts/heapdump-hook.cjs, which writes to a KNOWN mounted path, LOGS each step,
# and AUTO-DUMPS early (heap still small -> little transient RAM -> VM-safe), no
# external signal needed. Two early dumps -> diff them to see what grew.
#
# RECIPE (on miranda):
#   scp docker-compose.debug.yml scripts/heapdump-hook.cjs miranda:weather/heapdumps/  # hook must sit in the mount
#   # (put the override at ~/weather/, the hook inside ~/weather/heapdumps/)
#   scp docker-compose.debug.yml miranda:weather/
#   ssh miranda
#   cd ~/weather
#   mkdir -p heapdumps && chmod 777 heapdumps
#   docker compose -f docker-compose.yml -f docker-compose.debug.yml up -d public
#   docker compose logs -f public              # "[heapdump] hook armed -> /app/heapdumps ..."
#
#   # WATCH the periodic line — it tells us the leak CLASS before we even diff:
#   #   [heapdump] mem MB  rss=... heapUsed=... external=... arrayBuffers=...
#   # If external/arrayBuffers climbs fastest -> native Buffer/PNG leak, not JS objects.
#   #
#   # drive light /watch traffic (or a curl loop) for a couple of minutes. The hook
#   # auto-dumps at HEAPDUMP_AT seconds; watch the log for "[heapdump] wrote ...".
#   # (Box is ~10GB, so no need to stop other services; dumps have plenty of room.)
#   ls -lh heapdumps/                          # -> dump-t45-*.heapsnapshot, dump-t90-*.heapsnapshot
#
#   docker compose start worker                # restore worker
#   docker compose up -d public                # restore public to normal (drops this override)
#   exit
#
# DIFF locally (roomy machine — the top grower is the leak):
#   scp 'miranda:weather/heapdumps/dump-*.heapsnapshot' heapdumps/
#   ls -tr heapdumps/dump-*.heapsnapshot        # earlier (t45) then later (t90)
#   node --max-old-space-size=12288 scripts/analyze-heapsnapshot.mjs \
#     heapdumps/dump-t45-*.heapsnapshot heapdumps/dump-t90-*.heapsnapshot
#
# Manual extra dump any time:  docker compose exec public kill -USR2 1
# Tune dump timing:  add  HEAPDUMP_AT: "60,150"  under environment (default "45,90").
services:
  public:
    restart: "no"
    working_dir: /app/heapdumps
    command: ["node", "--require", "/app/heapdumps/heapdump-hook.cjs", "/app/public/server.js"]
    environment:
      # near-heap-limit=1 is V8's own dump, fired from inside GC -> catches even a
      # SYNCHRONOUS runaway that starves the hook's poll. Safe now (10GB box). It
      # writes to CWD, which working_dir pins to the mounted /app/heapdumps.
      NODE_OPTIONS: "--max-old-space-size=2048 --heapsnapshot-near-heap-limit=1"
      HEAPDUMP_DIR: /app/heapdumps
      HEAPDUMP_HEAP_MB: "700,1400"   # hook thresholds (async path); each fires once
    volumes:
      - ./heapdumps:/app/heapdumps
