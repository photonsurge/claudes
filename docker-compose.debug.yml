# Heap-leak capture override for the `public` service — LOW-FOOTPRINT variant.
#
# Unlike an auto-dump-at-the-limit approach (which spikes RAM exactly when public
# is already biggest and can OOM a small VM), this dumps ON DEMAND via a signal,
# so YOU pick the moment — while RSS is still modest and the box has headroom.
#
#   - --heapsnapshot-signal=SIGUSR2: a snapshot is written each time the process
#     gets SIGUSR2, to the working dir (mounted out to ./heapdumps on the host).
#   - --max-old-space-size=1024: a safety net only; the signal is the real trigger.
#   - restart:"no": one clean run, no crash-loop.
#
# RECIPE (frees headroom first so the snapshot can't tip the VM):
#   scp docker-compose.debug.yml miranda:weather/
#   ssh miranda
#   cd ~/weather
#   mkdir -p heapdumps && chmod 777 heapdumps
#   docker compose stop worker                       # frees ~1-1.5GB of headroom
#   docker compose -f docker-compose.yml -f docker-compose.debug.yml up -d public
#
#   # drive the leak (worker/director is stopped, so hammer the changed hot path
#   # ourselves — varied coords bust the 60s focus cache -> real composes):
#   seq 1 100000 | xargs -P8 -I{} sh -c \
#     'curl -s "http://127.0.0.1:10100/api/focus?kind=storm&lng=$((RANDOM%360-180))&lat=$((RANDOM%180-90))&zoom=5&detail=broadcast" -o /dev/null'
#
#   # in another shell, watch RSS climb; when it's ~800MB-1GB, dump (well below the box limit):
#   docker stats --no-stream public
#   docker compose kill -s SIGUSR2 public            # writes ./heapdumps/Heap.*.heapsnapshot (a few sec)
#   ls -lh heapdumps/
#
#   # stop the load loop (Ctrl-C), then restore:
#   docker compose start worker
#   docker compose up -d public                      # back to normal (drops this override)
#   exit
#
# Analyze locally (roomy machine, NOT the VM):
#   scp 'miranda:weather/heapdumps/*.heapsnapshot' heapdumps/
#   node --max-old-space-size=12288 scripts/analyze-heapsnapshot.mjs heapdumps/Heap.*.heapsnapshot
services:
  public:
    restart: "no"
    working_dir: /app/heapdumps
    command: ["node", "/app/public/server.js"]
    environment:
      NODE_OPTIONS: "--heapsnapshot-signal=SIGUSR2 --max-old-space-size=1024"
    volumes:
      - ./heapdumps:/app/heapdumps
