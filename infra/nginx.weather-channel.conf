# nginx reverse-proxy for weather-channel (host nginx in front of the compose
# stack, which publishes on 127.0.0.1). Single-domain setup: the Next app at /
# and Socket.IO at /socket.io/ on the SAME domain — so the public build uses
#   NEXT_PUBLIC_SOCKET_URL=https://io.photonsurge.uk
# (Socket.IO connects to same-origin + the default /socket.io/ path.)
#
# Put this in /etc/nginx/sites-available/weather-channel, symlink into
# sites-enabled, add a cert (e.g. certbot --nginx -d io.photonsurge.uk),
# then: nginx -t && systemctl reload nginx.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name io.photonsurge.uk;
    # certbot serves the ACME challenge here, then redirects to 443.
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name io.photonsurge.uk;

    # ssl_certificate     /etc/letsencrypt/live/io.photonsurge.uk/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/io.photonsurge.uk/privkey.pem;

    # WeatherChannel scenes/textures can be large; allow big responses + no buffering hiccups.
    client_max_body_size 25m;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ── Socket.IO (must allow the WebSocket upgrade + long-lived connections) ──
    location /socket.io/ {
        proxy_pass http://127.0.0.1:10101;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
    }

    # ── Next.js app (operator /control, broadcast /watch/:scene, API) ──
    location / {
        proxy_pass http://127.0.0.1:10100;
    }

    # ── Optional: worker health/status (lock down or drop in production) ──
    # location /worker/ {
    #     proxy_pass http://127.0.0.1:10102/;
    # }
}
